<!doctype html>
<!--
  Space Explorer, exactly as the Platanus cabinet runs it: the shipped
  game.js, untouched, over Phaser 3.87. It lives in its own document so the
  game's window-level key listeners (W A S D, U I O J K L, Enter) only hear
  keys while this frame has focus, and the site never loads 1.2 MB of engine
  unless someone presses Play. Refresh game.js with `npm run arcade`.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Space Explorer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #070709;
      }

      #game-root {
        width: 100%;
        height: 100%;
      }

      /* A finger on the game must never scroll, zoom or select. */
      body {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }

      canvas {
        display: block;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script src="phaser.min.js"></script>
    <script>
      // THE SITE'S HANDLES — the phone layer (src/lib/arcade-touch.ts)
      // needs two things the game keeps inside its own closure: which scene
      // is running (the pause glyph follows the flight), and its sound (iOS lets a frame's audio
      // start only inside a real tap, which happens out here). Both are
      // caught as the game makes them; game.js itself stays the cabinet's.
      (() => {
        const Game = Phaser.Game;
        Phaser.Game = class extends Game {
          constructor(config) {
            super(config);
            window.__arcadeGame = this;
          }
        };
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC)
          window.AudioContext = class extends AC {
            constructor(...args) {
              super(...args);
              window.__arcadeAudio = this;
            }
          };
      })();
    </script>
    <script src="game.js"></script>
    <script>
      // The cabinet's keys are letters and Enter, but a browser still
      // scrolls or activates things on Space and the arrows; inside the
      // frame nothing should move but the ship.
      window.addEventListener('keydown', e => {
        if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key))
          e.preventDefault();
      });
      window.focus();
    </script>
  </body>
</html>
